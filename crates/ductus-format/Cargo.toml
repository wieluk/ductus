[package]
name = "ductus-format"
description = "Ductus file formats: SVG pages and the folder-based notebook library"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ductus-core.workspace = true
ductus-ink.workspace = true
ductus-math.workspace = true
kurbo.workspace = true
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
resvg = "0.49"
tempfile = "3"

[lints]
workspace = true
