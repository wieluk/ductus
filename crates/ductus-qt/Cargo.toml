[package]
name = "ductus-qt"
description = "Ductus: handwritten notebooks (Qt Quick application)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ductus"
path = "src/main.rs"

[dependencies]
ductus-core.workspace = true
ductus-canvas.workspace = true
ductus-format.workspace = true
ductus-pdf.workspace = true
ductus-search.workspace = true
ductus-hwr.workspace = true
ductus-update.workspace = true
ductus-render.workspace = true
kurbo.workspace = true
cxx = "1"
tiny-skia = "0.12"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cxx-qt-build = "0.10"

# The program icon in ductus.exe.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[lints]
workspace = true
