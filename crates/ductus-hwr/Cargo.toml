[package]
name = "ductus-hwr"
description = "Handwriting recognition for Ductus: ink lines, line images and pluggable recognizers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ductus-core.workspace = true
ductus-ink.workspace = true
ductus-render.workspace = true
ductus-update.workspace = true
kurbo.workspace = true
tiny-skia = "0.12"
base64 = "0.23"
ndarray = "0.17"
# Loads the ONNX Runtime library the app ships (build-aux/fetch-onnxruntime.sh) instead of linking it.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ureq = { version = "3.5", features = ["json"] }

[lints]
workspace = true
