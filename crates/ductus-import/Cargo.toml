[package]
name = "ductus-import"
description = "Notes from other apps (Xournal++, Rnote, OneNote) as Ductus pages"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ductus-core.workspace = true
ductus-format.workspace = true
ductus-math.workspace = true
ductus-pdf.workspace = true
base64 = "0.23"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
lopdf = "0.46"
onenote_parser = { version = "2.1", features = ["onepkg"] }
quick-xml = "0.42"
resvg = { version = "0.49", default-features = false, features = ["raster-images"] }
serde_json = "1"
typed-path = "0.12"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
