# Builds on main also keep the caches release.yml starts from.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", LICENSE]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# actions/checkout runs `git init`, which hints about the default branch name otherwise.
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  # Android builds on main (to keep its cache warm for releases) and for pull requests that touch it.
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      android: ${{ steps.diff.outputs.android }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          android=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && ! git diff --name-only "$BASE" HEAD \
            | grep -qE '^(crates/ductus-qt/|build-aux/(android/|fetch-)|Cargo\.lock$|\.github/)'; then
            android=false
          fi
          echo "android=$android" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    uses: ./.github/workflows/build.yml
    with:
      android: ${{ needs.changes.outputs.android == 'true' }}
