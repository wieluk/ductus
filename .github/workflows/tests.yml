name: Tests

on:
  workflow_call:

permissions:
  contents: read

# actions/checkout runs `git init`, which hints about the default branch name otherwise.
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      # Known vulnerabilities in dependencies, and crates only from crates.io (deny.toml).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans sources
      - run: build-aux/fetch-pdfium.sh linux-x64 target/pdfium
      - run: cargo test --locked --workspace --exclude ductus-qt
        env:
          DUCTUS_PDFIUM: ${{ github.workspace }}/target/pdfium/lib
      - run: cargo clippy --locked --workspace --exclude ductus-qt --all-targets -- -D warnings
