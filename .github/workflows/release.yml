# `git tag v0.2.0 && git push origin v0.2.0` builds every platform with that version and
# publishes the release; `-suffix` tags become pre-releases. Run by hand to build without one.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (blank: Cargo.toml's)"
        type: string
        default: ""
      linux:
        type: boolean
        default: true
      windows:
        type: boolean
        default: true
      android:
        type: boolean
        default: true
      create_release:
        description: "Make a draft release"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  prepare:
    name: Version and notes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # notes come from the commits since the last tag
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version=${INPUT_VERSION#v}
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 build-aux/release/release.py version "$VERSION"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 build-aux/release/release.py metainfo "$GITHUB_REF_NAME"
            python3 build-aux/release/release.py notes "$GITHUB_REF_NAME" > notes.md
          else
            echo "Development build of $GITHUB_SHA." > notes.md
          fi
          git diff > stamp.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stamp
          path: |
            stamp.patch
            notes.md
          retention-days: 3

  linux:
    needs: prepare
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
      # build-linux deletes these unused runner toolchains: the build needs their disk space.
      volumes:
        - /usr/share/dotnet:/runner-tools/dotnet
        - /usr/local/lib/android:/runner-tools/android
        - /usr/local/.ghcup:/runner-tools/ghcup
        - /opt/hostedtoolcache:/runner-tools/toolcache
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/stamp
      # Signed bundles follow the update repository.
      - if: github.ref_type == 'tag'
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: build-aux/linux/import-key.sh
      - uses: ./.github/actions/build-linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ductus-linux
          path: dist/*.flatpak
          if-no-files-found: error

  windows:
    needs: prepare
    if: github.event_name != 'workflow_dispatch' || inputs.windows
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # The version patch has LF line endings.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/stamp
      - uses: ./.github/actions/build-windows
        with:
          args: -Version ${{ env.VERSION }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ductus-windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  android:
    needs: prepare
    if: github.event_name != 'workflow_dispatch' || inputs.android
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/stamp
      - env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi
      - uses: ./.github/actions/build-android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ductus-android
          path: dist/*.apk
          if-no-files-found: error

  release:
    needs: [tests, prepare, linux, windows, android]
    # Skipped platforms don't block a draft; a failed one blocks everything.
    if: |
      always() && !cancelled() && !contains(needs.*.result, 'failure')
      && needs.tests.result == 'success'
      && (github.ref_type == 'tag' || inputs.create_release)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages
          pattern: ductus-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stamp
          path: stamp
      # Apps only install updates whose checksums carry this signature.
      - env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          cd packages && sha256sum -- * > SHA256SUMS.txt && cd ..
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::UPDATE_SIGNING_KEY is not set: apps won't install this release."
            exit 0
          fi
          umask 077
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/update.pem"
          public=$(openssl pkey -in "$RUNNER_TEMP/update.pem" -pubout -outform DER | tail -c 32 | base64 -w0)
          if ! grep -qF "\"$public\"" crates/ductus-update/src/lib.rs; then
            echo "::error::UPDATE_SIGNING_KEY doesn't match PUBLIC_KEY in crates/ductus-update."
            exit 1
          fi
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/update.pem" -rawin \
            -in packages/SHA256SUMS.txt -out packages/SHA256SUMS.txt.sig
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Ductus ${{ env.VERSION }}
          body_path: stamp/notes.md
          draft: ${{ github.ref_type != 'tag' }}
          prerelease: ${{ contains(env.VERSION, '-') }}
          files: packages/*

  # Stable releases go into the Flatpak repository on GitHub Pages.
  flatpak-repo:
    needs: [prepare, release]
    if: |
      always() && needs.release.result == 'success' && github.ref_type == 'tag'
      && !contains(needs.prepare.outputs.version, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: gh-pages
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ductus-linux
          path: bundle
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq flatpak ostree
      - env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: build-aux/linux/import-key.sh
      # Start from the published repository to keep its history.
      - id: pages
        if: env.FLATPAK_GPG_KEY_ID != ''
        run: git ls-remote --exit-code --heads origin gh-pages > /dev/null && echo "exists=true" >> "$GITHUB_OUTPUT" || true
      - uses: actions/checkout@v7.0.1
        if: steps.pages.outputs.exists == 'true'
        with:
          ref: gh-pages
          path: pages
          persist-credentials: false
      - if: env.FLATPAK_GPG_KEY_ID != ''
        run: build-aux/linux/publish-repo.sh bundle/*.flatpak pages/repo
      - uses: peaceiris/actions-gh-pages@v4
        if: env.FLATPAK_GPG_KEY_ID != ''
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages/repo
          destination_dir: repo
          keep_files: true
