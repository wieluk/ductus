# `git tag v0.2.0 && git push origin v0.2.0` builds every platform with that version and
# publishes the release; `-suffix` tags become pre-releases. Run by hand to build without one.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (blank: Cargo.toml's)"
        type: string
        default: ""
      linux:
        type: boolean
        default: true
      windows:
        type: boolean
        default: true
      android:
        type: boolean
        default: true
      android_abi:
        description: "Android: arm64-v8a for devices, x86_64 for emulators"
        type: choice
        options: [arm64-v8a, x86_64]
        default: arm64-v8a
      create_release:
        description: "Make a draft release"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

# actions/checkout runs `git init`, which hints about the default branch name otherwise.
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  prepare:
    name: Version and notes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # notes come from the commits since the last tag
          persist-credentials: false
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          CREATE_RELEASE: ${{ inputs.create_release }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version=${INPUT_VERSION#v}
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          fi
          # A draft must never land in a published release of the same version.
          if [ "$CREATE_RELEASE" = true ] && git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already released: give this build a version of its own."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 build-aux/release/release.py version "$VERSION"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 build-aux/release/release.py metainfo "$GITHUB_REF_NAME"
            python3 build-aux/release/release.py notes "$GITHUB_REF_NAME" > notes.md
          else
            echo "Development build of $GITHUB_SHA." > notes.md
          fi
          git diff > stamp.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stamp
          path: |
            stamp.patch
            notes.md
          retention-days: 3

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      release: true
      linux: ${{ github.event_name != 'workflow_dispatch' || inputs.linux }}
      windows: ${{ github.event_name != 'workflow_dispatch' || inputs.windows }}
      android: ${{ github.event_name != 'workflow_dispatch' || inputs.android }}
      android_abi: ${{ inputs.android_abi || 'arm64-v8a' }}
    secrets: inherit

  release:
    needs: [tests, prepare, build]
    # Skipped platforms don't block a draft; a failed one blocks everything.
    if: |
      always() && !cancelled() && !contains(needs.*.result, 'failure')
      && needs.tests.result == 'success'
      && (github.ref_type == 'tag' || inputs.create_release)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages
          pattern: ductus-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stamp
          path: stamp
      # Apps only install updates whose checksums carry this signature; only tags get it.
      - env:
          UPDATE_SIGNING_KEY: ${{ github.ref_type == 'tag' && secrets.UPDATE_SIGNING_KEY || '' }}
        run: |
          cd packages && sha256sum -- * > SHA256SUMS.txt && cd ..
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::UPDATE_SIGNING_KEY is not set: apps wouldn't install this release."
              exit 1
            fi
            echo "::warning::Not a tag: the draft isn't signed for updates."
            exit 0
          fi
          umask 077
          trap 'rm -f "$RUNNER_TEMP/update.pem"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/update.pem"
          public=$(openssl pkey -in "$RUNNER_TEMP/update.pem" -pubout -outform DER | tail -c 32 | base64 -w0)
          if ! grep -qF "\"$public\"" crates/ductus-update/src/lib.rs; then
            echo "::error::UPDATE_SIGNING_KEY doesn't match PUBLIC_KEY in crates/ductus-update."
            exit 1
          fi
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/update.pem" -rawin \
            -in packages/SHA256SUMS.txt -out packages/SHA256SUMS.txt.sig
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Ductus ${{ env.VERSION }}
          body_path: stamp/notes.md
          draft: ${{ github.ref_type != 'tag' }}
          prerelease: ${{ contains(env.VERSION, '-') }}
          files: packages/*

  # Stable releases go into the Flatpak repository on GitHub Pages.
  flatpak-repo:
    needs: [prepare, release]
    if: |
      always() && needs.release.result == 'success' && github.ref_type == 'tag'
      && !contains(needs.prepare.outputs.version, '-')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    concurrency:
      group: gh-pages
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ductus-linux
          path: bundle
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq flatpak ostree
      - env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: build-aux/linux/import-key.sh
      # Start from the published repository to keep its history.
      - id: pages
        if: env.FLATPAK_GPG_KEY_ID != ''
        # Exit code 2 means no such branch; anything else is an error, not a reason to start over.
        run: |
          status=0
          git ls-remote --exit-code --heads origin gh-pages > /dev/null || status=$?
          case $status in
            0) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            2) ;;
            *) exit "$status" ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pages.outputs.exists == 'true'
        with:
          ref: gh-pages
          path: pages
          persist-credentials: false
      - if: env.FLATPAK_GPG_KEY_ID != ''
        run: build-aux/linux/publish-repo.sh bundle/*.flatpak pages/repo
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        if: env.FLATPAK_GPG_KEY_ID != ''
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages/repo
          destination_dir: repo
          keep_files: true
