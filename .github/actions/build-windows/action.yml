name: Build for Windows
description: Builds, tests and packages with build-aux/windows/package.ps1.
inputs:
  args:
    description: Arguments for package.ps1
    default: ""
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
    # Tags can only restore caches saved on main.
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        shared-key: windows
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-on-failure: true
    - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
      with:
        # renovate: datasource=github-tags depName=qt/qtbase
        version: "6.10.3"
        arch: win64_msvc2022_64
        cache: true
    - shell: pwsh
      run: |
        if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
    - shell: pwsh
      run: build-aux\windows\package.ps1 ${{ inputs.args }}
