name: Build for Windows
description: Builds, tests and packages with build-aux/windows/package.ps1.
inputs:
  installer:
    description: Also make the zip and installer (CI builds only test)
    default: "false"
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
    # Tags can only restore caches saved on main.
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        shared-key: windows
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-on-failure: true
    - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
      with:
        # renovate: datasource=github-tags depName=qt/qtbase
        version: "6.10.3"
        arch: win64_msvc2022_64
        cache: true
        # renovate: datasource=pypi depName=aqtinstall
        aqtversion: ==3.3.0
    - if: inputs.installer == 'true'
      shell: pwsh
      run: |
        if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --version 6.7.1 --no-progress -y }
    # The version comes from Cargo.toml, which the stamp action set for releases.
    - shell: pwsh
      env:
        INSTALLER: ${{ inputs.installer }}
      run: |
        if ($env:INSTALLER -eq 'true') { build-aux\windows\package.ps1 } else { build-aux\windows\package.ps1 -NoPackage }
