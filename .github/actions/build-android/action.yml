name: Build for Android
description: Builds the APK with build-aux/android/build-apk.sh; NDK, Qt and Rust are cached.
inputs:
  qt-version:
    description: Qt for Android and the desktop Qt its tools need
    # renovate: datasource=github-tags depName=qt/qtbase
    default: "6.10.3"
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        targets: aarch64-linux-android
    # Tags can only restore caches saved on main.
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        shared-key: android
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-on-failure: true
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /usr/local/lib/android/sdk/ndk/27.2.12479018 # $ANDROID_HOME on the runner
        key: android-ndk-27.2.12479018
    - shell: bash
      run: |
        # `yes` dies of SIGPIPE when sdkmanager stops reading.
        (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
        parts=("platforms;android-35" "build-tools;35.0.0")
        [ -d "$ANDROID_HOME/ndk/27.2.12479018" ] || parts+=("ndk;27.2.12479018")
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "${parts[@]}" > /dev/null
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: qt
      with:
        path: ${{ runner.temp }}/Qt
        key: qt-android-${{ inputs.qt-version }}
    - if: steps.qt.outputs.cache-hit != 'true'
      shell: bash
      run: |
        # renovate: datasource=pypi depName=aqtinstall
        pip install aqtinstall==3.3.0
        aqt install-qt linux desktop ${{ inputs.qt-version }} linux_gcc_64 -O "$RUNNER_TEMP/Qt"
        aqt install-qt all_os android ${{ inputs.qt-version }} android_arm64_v8a -O "$RUNNER_TEMP/Qt"
    - shell: bash
      run: |
        ANDROID_SDK_ROOT=$ANDROID_HOME ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018 \
        JAVA_HOME=$JAVA_HOME_17_X64 QT_ANDROID=$RUNNER_TEMP/Qt/${{ inputs.qt-version }}/android_arm64_v8a \
        QT_HOST=$RUNNER_TEMP/Qt/${{ inputs.qt-version }}/gcc_64 build-aux/android/build-apk.sh
