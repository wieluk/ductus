name: Apply the release version
description: Applies the version patch made by release.yml's prepare job.
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: stamp
        path: .stamp
    - shell: bash
      run: git apply --allow-empty .stamp/stamp.patch
