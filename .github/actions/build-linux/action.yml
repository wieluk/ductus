name: Build for Linux
description: Builds in the KDE SDK and runs ductus-qt's checks and the UI tests (in the flatpak-github-actions container); build-flatpak.sh package makes the bundle.
runs:
  using: composite
  steps:
    # Mounted by the workflow; the runner's disk is too small for the build otherwise.
    - shell: bash
      run: rm -rf /runner-tools/*/* && df -h .
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        components: clippy
    # Tags can only restore caches saved on main.
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        shared-key: linux
        workspaces: ". -> target/sdk-6.10"
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-on-failure: true
    - shell: bash
      run: build-aux/linux/build-flatpak.sh binary
    # The Qt half only builds here, where Qt is: its unit tests and lints too.
    - shell: bash
      run: |
        build-aux/sdk-run.sh cargo test --release --locked -p ductus-qt --features test-hooks
        build-aux/sdk-run.sh cargo clippy --release --locked -p ductus-qt --all-targets --features test-hooks -- -D warnings
    - shell: bash
      run: build-aux/sdk-run.sh build-aux/ui-tests.sh target/sdk-6.10/release/ductus-test
