name: Build for Linux
description: Builds in the KDE SDK, runs the UI tests and packages the Flatpak (in the flatpak-github-actions container).
runs:
  using: composite
  steps:
    # Mounted by the workflow; the runner's disk is too small for the build otherwise.
    - shell: bash
      run: rm -rf /runner-tools/*/* && df -h .
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
    # Tags can only restore caches saved on main.
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: linux
        workspaces: ". -> target/sdk-6.10"
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-on-failure: true
    - shell: bash
      run: build-aux/linux/build-flatpak.sh binary
    - shell: bash
      run: build-aux/sdk-run.sh build-aux/ui-tests.sh target/sdk-6.10/release/ductus
    - shell: bash
      env:
        FLATPAK_ARGS: --disable-rofiles-fuse
      run: build-aux/linux/build-flatpak.sh package
