[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
ductus-core = { path = "crates/ductus-core" }
ductus-ink = { path = "crates/ductus-ink" }
ductus-render = { path = "crates/ductus-render" }
ductus-canvas = { path = "crates/ductus-canvas" }
ductus-format = { path = "crates/ductus-format" }
ductus-import = { path = "crates/ductus-import" }
ductus-pdf = { path = "crates/ductus-pdf" }
ductus-math = { path = "crates/ductus-math" }
ductus-search = { path = "crates/ductus-search" }
ductus-hwr = { path = "crates/ductus-hwr" }
ductus-update = { path = "crates/ductus-update" }
kurbo = "0.13"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"

# Recognition models are unusably slow without optimizations, even in development builds.
[profile.dev.package]
candle-core = { opt-level = 3 }
candle-nn = { opt-level = 3 }
gemm = { opt-level = 3 }
gemm-common = { opt-level = 3 }
gemm-f32 = { opt-level = 3 }
ductus-hwr = { opt-level = 3 }
