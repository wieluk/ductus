# Packages the build from build-aux/linux/build-flatpak.sh (compiled in the same KDE SDK).
id: app.ductus.Ductus
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
command: ductus
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-documents
  - --socket=cups
  # Handwriting recognizer servers and the update check.
  - --share=network
  # Updates run `flatpak update` on the host.
  - --talk-name=org.freedesktop.Flatpak
build-options:
  no-debuginfo: true
modules:
  - name: ductus
    buildsystem: simple
    build-commands:
      - install -Dm755 -s ductus /app/bin/ductus
      - install -Dm755 libpdfium.so /app/lib/libpdfium.so
      - install -Dm644 LICENSE /app/share/licenses/pdfium/LICENSE
      - install -Dm644 app.ductus.Ductus.desktop -t /app/share/applications
      - install -Dm644 app.ductus.Ductus.metainfo.xml -t /app/share/metainfo
      - install -Dm644 app.ductus.Ductus.svg -t /app/share/icons/hicolor/scalable/apps
    sources:
      - type: file
        path: ../target/sdk-6.10/release/ductus
      - type: file
        path: ../target/pdfium/lib/libpdfium.so
      - type: file
        path: ../target/pdfium/LICENSE
      - type: file
        path: ../data/app.ductus.Ductus.desktop
      - type: file
        path: ../data/app.ductus.Ductus.metainfo.xml
      - type: file
        path: ../data/app.ductus.Ductus.svg
